capability_profile = "KNOWLEDGE"
contract_version = "1.3.0"
environment = "local"
log_level = "INFO"

mcp_host = "127.0.0.1"
mcp_port = 8080
mcp_path = "/mcp"
ops_host = "127.0.0.1"
ops_port = 8090

s3_use_path_style = true

upload_max_bytes = 52428800
presigned_upload_ttl_seconds = 900
presigned_download_ttl_seconds = 300
presigned_download_max_ttl_seconds = 3600

embedding_provider = "openai"
sparse_provider = "bm25"

embedding_dense_model = "qwen/qwen3-embedding-8b"
embedding_sparse_model = "qdrant/bm25"
embedding_reranker_model = "qwen/qwen3-reranker-8b"
embedding_dense_dimension = 4096
embedding_batch_size = 32
embedding_concurrency = 4

bm25_k1 = 1.2
bm25_b = 0.75
bm25_avg_doc_len_tokens = 400
bm25_vocab_size = 1048576

chunk_size_tokens = 512
chunk_overlap_tokens = 64

search_dense_candidates = 50
search_sparse_candidates = 50
search_default_limit = 10
search_max_limit = 50
search_max_candidates = 200
enable_reranker = true
allow_dense_only_fallback = true
allow_sparse_only_fallback = false
search_rrf_k = 60
search_max_chunk_chars = 4000
search_return_full_table = true
search_min_rerank_confidence = 0.45
search_min_dense_confidence = 0.6

enable_query_expansion = false
query_expansion_min_rerank_score = 0.30
query_expansion_max_variants = 3
enable_hyde = true
expansion_model = "qwen/qwen3-8b"
expansion_timeout_seconds = 15.0

worker_concurrency = 4
worker_prefetch = 8
lease_ttl_seconds = 120
heartbeat_interval_seconds = 30
max_attempts = 5
stale_upload_ttl_seconds = 3600
recovery_interval_seconds = 60
