# Local per-domain stack (spec section 20, Stage 0). Isolated Postgres, Qdrant, MinIO,
# RabbitMQ + a deterministic fake Embedding API, then migrate -> server + worker.
#
#   docker compose up -d                          # backing services only (run the app by hand)
#   docker compose --profile app up -d --build    # + migrate, server and worker in containers
#
# The server/worker/migrate services sit behind the `app` profile so the default `up`
# gives you just the environment: `rag-mcp serve` / `rag-mcp worker` then run in your
# console against the published ports.
#
# Token hashes come from your .env (RAG_MCP_CHAT_SERVICE_TOKEN_HASH / _OPS_...); generate:
#   python -c "from app.session.auth import hash_token; print(hash_token('chat-dev'))"

x-domain-env: &domain-env
  RAG_MCP_DOMAIN_ID: hr
  RAG_MCP_POSTGRES_URL: postgresql+asyncpg://hr:hr@postgres:5432/hr
  RAG_MCP_QDRANT_URL: http://qdrant:6333
  RAG_MCP_QDRANT_COLLECTION: hr-knowledge
  RAG_MCP_S3_ENDPOINT: http://minio:9000
  RAG_MCP_S3_BUCKET: hr-documents
  RAG_MCP_S3_ACCESS_KEY: hr-mcp
  RAG_MCP_S3_SECRET_KEY: hr-mcp-secret
  RAG_MCP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  RAG_MCP_QUEUE_NAMESPACE: hr
  RAG_MCP_EMBEDDING_API_URL: http://fake-embedding-api:8000
  RAG_MCP_CHAT_SERVICE_TOKEN_HASH: ${RAG_MCP_CHAT_SERVICE_TOKEN_HASH:-}
  RAG_MCP_OPS_SERVICE_TOKEN_HASH: ${RAG_MCP_OPS_SERVICE_TOKEN_HASH:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr
    # 5433 by default: the orchestrator's own Postgres owns 5432 on this machine.
    ports: ["${RAG_MCP_POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hr-mcp
      MINIO_ROOT_PASSWORD: hr-mcp-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 hr-mcp hr-mcp-secret; do sleep 1; done;
      mc mb --ignore-existing local/hr-documents;
      "

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  fake-embedding-api:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    environment:
      FAKE_EMBEDDING_HOST: 0.0.0.0
      FAKE_EMBEDDING_PORT: "8000"
      # Matches settings.toml embedding_dense_dimension (qwen3-embedding-8b native).
      FAKE_EMBEDDING_DIMENSION: "4096"
    ports: ["8000:8000"]

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment: *domain-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *domain-env
      RAG_MCP_MCP_HOST: 0.0.0.0
    command: ["rag-mcp", "serve"]
    # One port serves both surfaces: chat at /mcp, ops under /ops/internal/...
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      fake-embedding-api: {condition: service_started}

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment: *domain-env
    command: ["rag-mcp", "worker"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      fake-embedding-api: {condition: service_started}
